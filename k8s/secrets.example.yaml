# Copy to k8s/secrets.yaml and fill in real values. k8s/secrets.yaml is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: hospital-web-app
type: Opaque
data:
  uri: <BASE64_OF_MONGO_URI>  # echo -n "mongodb+srv://user:pass@host/db" | base64
---
apiVersion: v1
kind: Secret
metadata:
  name: linkerd-trust-anchor
  namespace: linkerd
type: Opaque
data:
  ca.crt: ""
  tls.crt: ""
  tls.key: ""
